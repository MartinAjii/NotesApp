steps:

  - name: "gcr.io/cloud-builders/docker"
    args: ["build",
            "-t", 
            "gcr.io/$PROJECT_ID/t3-092-be",
            "-f",
            "backend/Dockerfile",
            "backend"
          ]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/t3-092-be"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "t3-092-be",
        "--image",
        "gcr.io/$PROJECT_ID/t3-092-be",
        "--timeout",
        "1000s",
        "--port",
        "5000",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]

options:
  logging: CLOUD_LOGGING_ONLY